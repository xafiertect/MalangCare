worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Sembunyikan versi Nginx dari header
    server_tokens off;

    # Gzip global
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── HTTP → Redirect ke HTTPS (aktifkan jika sudah ada SSL) ──
    # Uncomment blok ini setelah SSL terpasang:
    #
    # server {
    #     listen 80;
    #     server_name yourdomain.com www.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── Server utama (HTTP untuk sekarang, nanti ganti HTTPS) ───
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Backend API — internal only ──────────────────────────
        location /api/ {
            proxy_pass         http://backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # Upload file besar (foto laporan)
            client_max_body_size 20M;
        }

        # ── Local file uploads (dev fallback storage) ────────────
        location /uploads/ {
            proxy_pass         http://backend:5000/uploads/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── Health check backend ─────────────────────────────────
        location /health {
            proxy_pass http://backend:5000/health;
        }

        # ── Frontend static — semua route lainnya ───────────────
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS (uncomment & isi setelah pasang SSL certificate) ──
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # (sama dengan blok HTTP di atas)
    # }
}
