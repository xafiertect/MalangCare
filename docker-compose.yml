version: '3.9'

services:
  # ─────────────────────────────────────
  # FRONTEND — React (Vite dev server)
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lapor_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_MAP_DEFAULT_LAT=-8.1654
      - VITE_MAP_DEFAULT_LNG=112.6208
      - VITE_MAP_DEFAULT_ZOOM=11
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - lapor-network

  # ─────────────────────────────────────
  # BACKEND — Express.js API
  # ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lapor_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:3001
      - DATABASE_URL=postgresql://lapor_user:${DB_PASSWORD}@postgres:5432/lapor_malang
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=lapor-malang
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_ACTIVE=${TELEGRAM_BOT_ACTIVE}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - lapor-network

  # ─────────────────────────────────────
  # DATABASE — PostgreSQL 15
  # ─────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: lapor_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: lapor_malang
      POSTGRES_USER: lapor_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapor_user -d lapor_malang"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lapor-network

  # ─────────────────────────────────────
  # REDIS — Cache & Token Store
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lapor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lapor-network

  # ─────────────────────────────────────
  # MINIO — Object Storage (S3-compatible)
  # ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: lapor_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lapor-network

  # ─────────────────────────────────────
  # MINIO INIT — Buat bucket otomatis
  # ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: lapor_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing myminio/lapor-malang;
      /usr/bin/mc anonymous set download myminio/lapor-malang/public;
      echo 'MinIO bucket initialized';
      exit 0;
      "
    networks:
      - lapor-network

volumes:
  pg_data:
    name: lapor_pg_data
  redis_data:
    name: lapor_redis_data
  minio_data:
    name: lapor_minio_data

networks:
  lapor-network:
    name: lapor-network
    driver: bridge
